<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メロン記録">
<meta name="theme-color" content="#DCE2D0">
<title>メロン栽培記録</title>
<style>
:root{
  --ground:#DCE2D0; --card:#F4F2E8; --tag:#FFFDF7; --ink:#17251D; --muted:#6E7A6A;
  --net:#C3B78E; --signal:#C6431A; --leaf:#1F5E44;
  --disp:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --body:"Hiragino Sans","Yu Gothic","Noto Sans JP","Helvetica Neue",sans-serif;
  --num:ui-monospace,"SF Mono","Menlo","Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  min-height:100vh;padding-bottom:70px;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 13px env(safe-area-inset-bottom)}
.head{padding:18px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.h1{font-family:var(--disp);font-size:18px;letter-spacing:.14em;margin:0}
.save{font-size:11px;color:var(--muted);font-family:var(--num)}
.tabs{display:flex;border-bottom:1px solid var(--net);margin-bottom:14px;position:sticky;top:0;background:var(--ground);z-index:5}
.tabs button{flex:1;background:none;border:none;padding:11px 0 9px;font-family:var(--disp);
  font-size:13px;letter-spacing:.12em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--signal)}
.card{background:var(--card);border:1px solid var(--net);border-radius:14px;padding:14px;margin-bottom:13px}
.sec{font-family:var(--disp);font-size:12px;letter-spacing:.18em;color:var(--muted);margin:0 0 9px}
.sec.mt{margin-top:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.f{margin:0}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--net);background:var(--tag);
  border-radius:9px;padding:9px 10px;font-family:var(--num);font-size:16px;color:var(--ink)}
.f textarea{font-family:var(--body);font-size:14px;min-height:52px;resize:vertical}
.f input.txt,.f select{font-family:var(--body);font-size:15px}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--leaf);outline-offset:1px}
.ro{color:var(--muted);background:rgba(0,0,0,.03)}
.scale{display:flex;gap:5px}
.scale button{flex:1;border:1px solid var(--net);background:var(--tag);border-radius:9px;
  padding:10px 2px;font-family:var(--num);font-size:14px;color:var(--muted);cursor:pointer}
.scale button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{border:1px solid var(--net);background:var(--tag);border-radius:999px;
  padding:8px 12px;font-size:13px;color:var(--muted);cursor:pointer;font-family:var(--body)}
.chips button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn{width:100%;border:none;border-radius:11px;background:var(--signal);color:#fff;padding:13px;
  font-size:15px;font-family:var(--body);font-weight:600;cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;border:1px solid var(--net);color:var(--muted);font-weight:400}
.btn.small{padding:9px;font-size:13px;margin-top:8px}
.btn:disabled{opacity:.4}
.note{font-size:11px;color:var(--muted);line-height:1.7;margin:7px 2px 0}
.row{background:var(--card);border:1px solid var(--net);border-radius:12px;padding:10px 12px;
  margin-bottom:7px;display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  font-family:var(--body);color:var(--ink)}
button.row{cursor:pointer}
.lead{font-family:var(--num);font-size:17px;font-weight:600;line-height:1.15;min-width:52px}
.lead small{display:block;font-size:9px;color:var(--muted);font-weight:400;margin-top:2px;font-family:var(--body)}
.bd{flex:1;font-size:13px;line-height:1.6}
.k{color:var(--muted);font-size:11px;margin-right:3px}
.v{font-family:var(--num)}
.memo{color:var(--muted);font-size:12px;margin-top:2px}
.brix{font-family:var(--num);font-weight:600;font-size:17px}
.brix.low{color:var(--signal)}
.empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:24px 16px;
  border:1px dashed var(--net);border-radius:14px;background:rgba(255,255,255,.35);margin-bottom:12px}
.del{background:none;border:none;color:var(--net);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
table.dt{width:100%;border-collapse:collapse;font-family:var(--num);font-size:12px}
table.dt th{font-family:var(--body);font-size:10px;color:var(--muted);font-weight:400;padding:0 3px 5px;text-align:left}
table.dt td{padding:2px 3px}
table.dt input{width:100%;border:1px solid var(--net);background:var(--tag);border-radius:6px;
  padding:6px 5px;font-family:var(--num);font-size:13px;color:var(--ink)}
.pill{display:inline-block;border:1px solid var(--net);border-radius:999px;padding:2px 8px;
  font-size:11px;color:var(--muted);margin-right:5px}
.pill.warn{border-color:var(--signal);color:var(--signal)}
.filter{display:flex;gap:5px;overflow-x:auto;padding-bottom:9px}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:0 0 auto;border:1px solid var(--net);background:var(--tag);border-radius:999px;
  padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--body)}
.filter button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stat{display:flex;justify-content:space-around;text-align:center;padding:2px 0 4px}
.stat div span{display:block;font-family:var(--num);font-size:22px;font-weight:600}
.stat div small{font-size:10px;color:var(--muted)}
.warnbar{background:#F7E3DA;border:1px solid var(--signal);color:var(--signal);
  border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.7;margin-bottom:13px}
.big{font-family:var(--num);font-size:24px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 class="h1">メロン栽培記録</h1><span class="save" id="status"></span></div>
  <div class="tabs" id="tabs"></div>
  <div id="warn"></div>
  <div id="app"></div>
</div>

<script>
"use strict";

var KEY = "melon-diary-v2";
var SEED = {
  plantDate: "2026-08-10",
  blocks: [
    { id:"b1", bed:1, side:"東", variety:"ミラノ",       start:1,   count:60, per:1 },
    { id:"b2", bed:1, side:"西", variety:"セイヌ",       start:101, count:62, per:1 },
    { id:"b3", bed:2, side:"東", variety:"ミラノ",       start:201, count:62, per:1 },
    { id:"b4", bed:2, side:"西", variety:"ポルト",       start:301, count:61, per:1 },
    { id:"b5", bed:3, side:"東", variety:"ミラノ",       start:401, count:60, per:1 },
    { id:"b6", bed:3, side:"西", variety:"パールシャドウ", start:501, count:62, per:2 }
  ],
  daily: [], events: [], fruits: []
};

var db = null, tab = "daily", editing = null, dailyMode = "one", fruitFilter = "all";
var exState = { kind:"fruit", blockIds:[], dateField:"pollen", from:"", to:"",
                onlyBrix:false, onlyHarvest:false, cols:["id","date","acc","size","brix","leaf","look","etc"] };

/* ---------- storage ---------- */
function canStore(){
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return false; }
}
function loadDb(){
  try { var s = localStorage.getItem(KEY); db = s ? JSON.parse(s) : JSON.parse(JSON.stringify(SEED)); }
  catch(e){ db = JSON.parse(JSON.stringify(SEED)); }
  if(!db.blocks) db.blocks = JSON.parse(JSON.stringify(SEED.blocks));
  if(!db.daily) db.daily = [];
  if(!db.events) db.events = [];
  if(!db.fruits) db.fruits = [];
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); status("保存済み"); }
  catch(e){ status("保存できませんでした"); alert("保存できませんでした。出力タブからバックアップを取ってください。"); }
}
function status(t){
  var el = document.getElementById("status");
  el.textContent = t;
  if(t === "保存済み") setTimeout(function(){ if(el.textContent === "保存済み") el.textContent = ""; }, 1200);
}

/* ---------- helpers ---------- */
function today(){
  var d = new Date(), p = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function dd(a,b){ if(!a||!b) return null;
  return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
function md(d){ return d ? (+d.slice(5,7)) + "/" + (+d.slice(8,10)) : ""; }
function n3(n){ return String(n).padStart(3,"0"); }
function num(v){ if(v===""||v==null) return null; var f = parseFloat(v); return isNaN(f)?null:f; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function blockName(b){ return b.bed + "列" + b.side + " " + b.variety; }
function findBlock(no){ if(!no) return null;
  for(var i=0;i<db.blocks.length;i++){ var b = db.blocks[i];
    if(no >= b.start && no < b.start + b.count) return b; }
  return null; }
function normDate(s){
  if(!s) return null;
  var t = String(s).trim().replace(/["']/g,"");
  var m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return m[1] + "-" + String(+m[2]).padStart(2,"0") + "-" + String(+m[3]).padStart(2,"0");
  m = t.match(/^(\d{1,2})[-\/.](\d{1,2})$/);
  if(m) return new Date().getFullYear() + "-" + String(+m[1]).padStart(2,"0") + "-" + String(+m[2]).padStart(2,"0");
  return null;
}
function accum(pollen,end){
  var g = 0, s = 0, n = 0;
  db.daily.forEach(function(r){
    if(!pollen || r.date < pollen || r.date > end) return;
    var t = r.tAvg != null ? r.tAvg : (r.tMax != null && r.tMin != null ? (r.tMax + r.tMin)/2 : null);
    if(t != null){ g += Math.max(t-10,0); n++; }
    if(r.solar != null) s += r.solar;
  });
  return { gdd:g, sol:s, n:n };
}
function val(id){ var e = document.getElementById(id); return e ? e.value : ""; }
function pick(k){ var e = document.querySelector('[data-grp="'+k+'"] button.on'); return e ? e.dataset.v : null; }
function scaleHtml(k,v){
  var h = '<div class="scale" data-grp="'+k+'">';
  for(var i=1;i<=5;i++) h += '<button type="button" data-v="'+i+'"'+(String(v)===String(i)?' class="on"':'')+'>'+i+'</button>';
  return h + '</div>';
}
function chipHtml(k,opts,v){
  var h = '<div class="chips" data-grp="'+k+'">';
  opts.forEach(function(o){ h += '<button type="button" data-v="'+esc(o)+'"'+(v===o?' class="on"':'')+'>'+esc(o)+'</button>'; });
  return h + '</div>';
}
document.addEventListener("click", function(e){
  var b = e.target.closest('[data-grp] button');
  if(!b) return;
  var on = b.classList.contains("on");
  b.parentNode.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
  if(!on) b.classList.add("on");
  if(b.parentNode.dataset.grp === "exkind" || b.parentNode.dataset.grp === "exdate"){ /* handled elsewhere */ }
});

/* ---------- shell ---------- */
var TABS = [["daily","日誌"],["fruit","果実"],["plant","株"],["out","出力"],["conf","設定"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    return '<button data-tab="'+t[0]+'"'+(tab===t[0]?' class="on"':'')+'>'+t[1]+'</button>';
  }).join("");
  document.querySelectorAll("#tabs button").forEach(function(b){
    b.onclick = function(){ tab = b.dataset.tab; editing = null; render(); };
  });
}
function render(){
  renderTabs();
  var el = document.getElementById("app");
  if(tab === "daily") el.innerHTML = dailyTab();
  else if(tab === "fruit") el.innerHTML = editing ? fruitForm() : fruitTab();
  else if(tab === "plant") el.innerHTML = plantTab();
  else if(tab === "out") el.innerHTML = exportTab();
  else el.innerHTML = confTab();
  bind();
  window.scrollTo(0,0);
}

/* ---------- 日誌 ---------- */
function dailyTab(){
  var h = '<div class="filter">'
    + '<button id="m1" class="'+(dailyMode==="one"?"on":"")+'">1日ずつ</button>'
    + '<button id="m2" class="'+(dailyMode==="bulk"?"on":"")+'">まとめて取り込む</button></div>';

  if(dailyMode === "one"){
    h += '<div class="card"><div class="sec">そ の 日 の 記 録</div><div class="g2">'
      + fld("d_date","日付",'<input type="date" id="d_date" value="'+today()+'">')
      + fld("d_solar","日射",'<input id="d_solar" inputmode="decimal">')
      + fld("d_tavg","平均気温 ℃",'<input id="d_tavg" inputmode="decimal">')
      + fld("d_tmax","最高気温 ℃",'<input id="d_tmax" inputmode="decimal">')
      + fld("d_tmin","最低気温 ℃",'<input id="d_tmin" inputmode="decimal">')
      + fld("d_ecin","給液EC",'<input id="d_ecin" inputmode="decimal">')
      + fld("d_ecout","排液EC",'<input id="d_ecout" inputmode="decimal">')
      + '</div>'
      + '<div class="f" style="margin-top:10px"><label>作業内容</label>'
      + '<textarea id="d_work" placeholder="整枝、交配、摘果、防除など"></textarea></div>'
      + '<div class="f" style="margin-top:10px"><label>設定変更（変えた日だけ）</label>'
      + '<textarea id="d_change" placeholder="給液EC 1.8→1.5、灌水回数 4→3 など"></textarea></div>'
      + '<button class="btn" id="d_save">この日を記録する</button></div>';
  } else {
    h += '<div class="card"><div class="sec">気 温 ・ 日 射 の 取 り 込 み</div>'
      + '<p class="note" style="margin-top:0">1行1日、左から 日付, 平均気温, 最高気温, 最低気温, 日射 の順'
      + '（カンマでもタブでも可）。見出し行は無視されます。</p>'
      + '<div class="f"><textarea id="d_paste" style="min-height:130px;font-family:var(--num);font-size:12px"></textarea></div>'
      + '<p class="note" id="d_prev"></p>'
      + '<button class="btn" id="d_imp">取り込む</button></div>';
  }

  if(db.daily.length === 0){
    h += '<div class="empty">まだ日誌がありません。<br>交配が始まったら、気温と日射をためていきます。</div>';
  } else {
    db.daily.slice(0,60).forEach(function(r){
      var w = ["日","月","火","水","木","金","土"][new Date(r.date+"T00:00:00").getDay()];
      h += '<div class="row"><div class="lead">'+md(r.date)+'<small>'+w+'</small></div><div class="bd">';
      if(r.tAvg != null || r.tMax != null)
        h += '<span class="k">気温</span><span class="v">'+(r.tAvg==null?"–":r.tAvg)+'（'+(r.tMax==null?"–":r.tMax)+'/'+(r.tMin==null?"–":r.tMin)+'）</span>　';
      if(r.solar != null) h += '<span class="k">日射</span><span class="v">'+r.solar+'</span>　';
      if(r.ecIn != null || r.ecOut != null)
        h += '<span class="k">EC</span><span class="v">'+(r.ecIn==null?"–":r.ecIn)+'→'+(r.ecOut==null?"–":r.ecOut)+'</span>';
      if(r.work) h += '<div class="memo">'+esc(r.work)+'</div>';
      if(r.change) h += '<div class="memo" style="color:var(--signal)">設定変更: '+esc(r.change)+'</div>';
      h += '</div><button class="del" data-deld="'+r.date+'">×</button></div>';
    });
  }
  return h;
}
function fld(id,label,input){ return '<div class="f"><label for="'+id+'">'+label+'</label>'+input+'</div>'; }

function mergeDaily(rows){
  var map = {};
  db.daily.forEach(function(r){ map[r.date] = r; });
  rows.forEach(function(r){
    var cur = map[r.date] || { date:r.date };
    Object.keys(r).forEach(function(k){
      if(r[k] !== null && r[k] !== "" && r[k] !== undefined) cur[k] = r[k];
    });
    map[r.date] = cur;
  });
  db.daily = Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  save(); render();
}
function parsePaste(txt){
  if(!txt.trim()) return [];
  return txt.trim().split(/\r?\n/).map(function(line){
    var c = line.split(/[\t,]/).map(function(s){ return s.trim(); });
    var d = normDate(c[0]);
    if(!d) return null;
    return { date:d, tAvg:num(c[1]), tMax:num(c[2]), tMin:num(c[3]), solar:num(c[4]) };
  }).filter(Boolean);
}

/* ---------- 果実 ---------- */
function fruitTab(){
  var done = db.fruits.filter(function(f){ return f.brix != null; });
  var avg = done.length ? done.reduce(function(s,f){ return s+f.brix; },0)/done.length : null;
  var h = '<div class="card"><div class="stat">'
    + '<div><span>'+db.fruits.length+'</span><small>記録した果実</small></div>'
    + '<div><span>'+done.length+'</span><small>糖度を測った</small></div>'
    + '<div><span>'+(avg==null?"–":avg.toFixed(1))+'</span><small>糖度の平均</small></div>'
    + '</div><button class="btn" id="f_new">果実を追加する</button></div>';

  h += '<div class="filter"><button data-ff="all" class="'+(fruitFilter==="all"?"on":"")+'">すべて</button>';
  db.blocks.forEach(function(b){
    h += '<button data-ff="'+b.id+'" class="'+(fruitFilter===b.id?"on":"")+'">'+esc(blockName(b))+'</button>';
  });
  h += '</div>';

  var list = db.fruits.filter(function(x){ return fruitFilter === "all" || x.blockId === fruitFilter; })
    .sort(function(a,b){ return a.no === b.no ? (a.fno||1)-(b.fno||1) : a.no-b.no; });

  if(list.length === 0){
    h += '<div class="empty">まだ果実の記録がありません。<br>交配した玉から、株番号と交配日だけ先に入れておけます。</div>';
  } else {
    list.forEach(function(x){
      var b = db.blocks.filter(function(z){ return z.id === x.blockId; })[0];
      var days = dd(x.pollen, x.harvest || today());
      h += '<button class="row" data-fid="'+x.id+'"><div class="lead">'
        + n3(x.no) + (b && b.per > 1 ? "-" + (x.fno||1) : "")
        + '<small>' + (b ? esc(b.variety) : "－") + '</small></div><div class="bd">';
      h += x.brix != null
        ? '<span class="brix'+(x.brix<14?" low":"")+'">'+x.brix.toFixed(1)+'</span>'
        : '<span class="k">糖度まだ</span>';
      h += '<span class="k" style="margin-left:6px">交配 '+md(x.pollen)+'</span>';
      if(days != null) h += '<span class="v" style="margin-left:6px">'+days+'日</span>';
      h += '<div>';
      if(x.harvest) h += '<span class="pill">収穫 '+md(x.harvest)+'</span>';
      if(x.dia) h += '<span class="pill">径 '+x.dia+'</span>';
      if(x.trouble) h += '<span class="pill warn">'+esc(x.trouble)+'</span>';
      h += '</div></div></button>';
    });
  }
  return h;
}

function fruitForm(){
  var f = editing.id ? editing : { no:"", fno:1, pollen:today(), harvest:"" };
  var g = function(k){ return f[k] == null ? "" : f[k]; };
  var h = '<div class="card"><div class="sec">果 実 の 特 定</div><div class="g3">'
    + fld("f_no","株番号",'<input id="f_no" inputmode="numeric" value="'+g("no")+'" placeholder="001">')
    + '<div class="f"><label>果実番号</label><select id="f_fno"><option value="1">1</option><option value="2">2</option></select></div>'
    + '<div class="f"><label>区画</label><input class="ro txt" id="f_block" readonly value="－"></div>'
    + '</div><div class="g3" style="margin-top:9px">'
    + fld("f_pollen","交配日",'<input type="date" id="f_pollen" value="'+g("pollen")+'">')
    + fld("f_harvest","収穫日",'<input type="date" id="f_harvest" value="'+g("harvest")+'">')
    + fld("f_days","開花後日数",'<input class="ro" id="f_days" readonly>')
    + '</div><p class="note" id="f_acc"></p><p class="note" id="f_tr" style="color:var(--signal)"></p></div>';

  h += '<div class="card"><div class="sec">収 穫 前 の 測 定</div><div class="g3">'
    + fld("f_dia","直径 mm",'<input id="f_dia" inputmode="decimal" value="'+g("dia")+'">')
    + fld("f_weight","重量 g",'<input id="f_weight" inputmode="decimal" value="'+g("weight")+'">')
    + fld("f_leaves","健全葉数",'<input id="f_leaves" inputmode="numeric" value="'+g("leaves")+'">')
    + '</div>'

function clean(v){ return v == null ? "" : String(v).replace(/[\r\n\t,]/g," "); }

function buildRows(){
  var o = exState;
  if(o.kind === "daily"){
    var rows = [["日付","平均気温","最高気温","最低気温","日射","給液EC","排液EC","作業内容","設定変更"]];
    db.daily.slice().filter(function(r){
      return (!o.from || r.date >= o.from) && (!o.to || r.date <= o.to);
    }).sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(r){
      rows.push([r.date,r.tAvg,r.tMax,r.tMin,r.solar,r.ecIn,r.ecOut,clean(r.work),clean(r.change)]);
    });
    return rows;
  }
  if(o.kind === "event"){
    var rows2 = [["日付","株番号from","株番号to","区画","内容","詳細"]];
    db.events.filter(function(e){
      if(o.from && e.date < o.from) return false;
      if(o.to && e.date > o.to) return false;
      if(o.blockIds.length){ var b = findBlock(e.from); if(!b || o.blockIds.indexOf(b.id) < 0) return false; }
      return true;
    }).sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(e){
      var b = findBlock(e.from);
      rows2.push([e.date,n3(e.from),n3(e.to),b?blockName(b):"",e.kind,clean(e.memo)]);
    });
    return rows2;
  }
  var cols = FRUIT_COLS.filter(function(c){ return o.cols.indexOf(c.key) >= 0; });
  var head = [];
  cols.forEach(function(c){ head = head.concat(c.head); });
  var rows3 = [head];
  db.fruits.filter(function(x){
    if(o.blockIds.length && o.blockIds.indexOf(x.blockId) < 0) return false;
    if(o.onlyBrix && x.brix == null) return false;
    if(o.onlyHarvest && !x.harvest) return false;
    var d = o.dateField === "harvest" ? x.harvest : x.pollen;
    if(o.from && (!d || d < o.from)) return false;
    if(o.to && (!d || d > o.to)) return false;
    return true;
  }).sort(function(a,b){ return a.no === b.no ? (a.fno||1)-(b.fno||1) : a.no-b.no; })
    .forEach(function(x){
      var b = db.blocks.filter(function(z){ return z.id === x.blockId; })[0];
      var end = x.harvest || today();
      var a = accum(x.pollen,end);
      var parts = {
        id:[n3(x.no), x.fno||1, b?b.bed:"", b?b.side:"", b?b.variety:"", db.plantDate],
        date:[x.pollen, x.harvest||"", dd(x.pollen,end)],
        acc:[a.gdd.toFixed(0), a.sol.toFixed(1)],
        size:[x.dia, x.weight],
        brix:[x.b1,x.b2,x.b3,x.brix, (x.b1!=null&&x.b3!=null)?(x.b1-x.b3).toFixed(1):""],
        leaf:[x.droop,x.color,x.leaves],
        look:[x.dens,x.relief,x.shoulder,x.ridge],
        etc:[x.trouble, clean(x.memo)]
      };
      var r = [];
      cols.forEach(function(c){ r = r.concat(parts[c.key]); });
      rows3.push(r);
    });
  return rows3;
}

/* ---------- clipboard / download ---------- */
function copyText(t,cb){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ cb(true); }, function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta); cb(ok);
  }
}
function downloadText(name,text,type){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{ type: type || "text/plain" }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 500);
}

      b.onclick = function(){
        var i = exState.blockIds.indexOf(b.dataset.b);
        if(i >= 0) exState.blockIds.splice(i,1); else exState.blockIds.push(b.dataset.b);
        render();
      };
    });
    document.querySelectorAll("#ex_df button").forEach(function(b){
      b.onclick = function(){ exState.dateField = b.dataset.d; render(); };
    });
    document.querySelectorAll("#ex_cond button").forEach(function(b){
      b.onclick = function(){ exState[b.dataset.c] = !exState[b.dataset.c]; render(); };
    });
    document.querySelectorAll("#ex_cols button").forEach(function(b){
      b.onclick = function(){
        var i = exState.cols.indexOf(b.dataset.c);
        if(i >= 0) exState.cols.splice(i,1); else exState.cols.push(b.dataset.c);
        render();
      };
    });
    document.getElementById("ex_from").onchange = function(){ exState.from = this.value; render(); };
    document.getElementById("ex_to").onchange = function(){ exState.to = this.value; render(); };

    document.getElementById("ex_copy").onclick = function(){
      var tsv = buildRows().map(function(r){
        return r.map(function(c){ return c == null ? "" : String(c); }).join("\t"); }).join("\n");
      copyText(tsv, function(ok){
        document.getElementById("ex_msg").textContent = ok
          ? "コピーしました。スプレッドシートのA1に貼り付けてください。"
          : "コピーできませんでした。CSVで保存してください。";
      });
    };
    document.getElementById("ex_dl").onclick = function(){
      var csv = "\ufeff" + buildRows().map(function(r){
        return r.map(function(c){ return c == null ? "" : String(c); }).join(","); }).join("\n");
      downloadText("melon-" + exState.kind + "-" + today() + ".csv", csv, "text/csv");
    };
    document.getElementById("bk_copy").onclick = function(){
      copyText(JSON.stringify(db), function(ok){
        document.getElementById("bk_msg").textContent = ok
          ? "コピーしました。メモアプリなどに貼って保存してください。" : "コピーできませんでした。";
      });
    };
    document.getElementById("bk_dl").onclick = function(){
      downloadText("melon-backup-" + today() + ".txt", JSON.stringify(db));
    };
    document.getElementById("bk_imp").onclick = function(){
      var t = val("bk_in").trim();
      if(!t){ alert("バックアップを貼り付けてください。"); return; }
      var d;
      try { d = JSON.parse(t); } catch(e){ alert("読み取れませんでした。"); return; }
      if(!d.blocks || !d.fruits){ alert("バックアップの形式が違います。"); return; }
      if(!confirm("いまの記録を、貼り付けた内容で置き換えます。")) return;
      db = d; save(); render();
    };
  }

  if(tab === "conf"){
    document.getElementById("c_save").onclick = function(){
      db.plantDate = val("c_plant");
      document.querySelectorAll("[data-c][data-i]").forEach(function(inp){
        var b = db.blocks[+inp.dataset.i], k = inp.dataset.c;
        b[k] = (k === "side" || k === "variety") ? inp.value : (parseInt(inp.value,10) || 0);
      });
      db.fruits = db.fruits.map(function(x){
        var b = findBlock(x.no);
        x.blockId = b ? b.id : null;
        return x;
      });
      save(); render();
    };
  }
}

/* ---------- start ---------- */
loadDb();
if(!canStore()){
  document.getElementById("warn").innerHTML =
    '<div class="warnbar">この環境では記録を保存できません。ファイルを端末に保存して、'
    + 'ホーム画面から開き直してください。それでも出る場合は、プライベートブラウズを解除してください。</div>';
}
render();
</script>
</body>
</html>
