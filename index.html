<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メロン記録">
<meta name="theme-color" content="#DCE2D0">
<title>メロン栽培記録</title>
<style>
:root{
  --ground:#DCE2D0; --card:#F4F2E8; --tag:#FFFDF7; --ink:#17251D; --muted:#6E7A6A;
  --net:#C3B78E; --signal:#C6431A; --leaf:#1F5E44;
  --disp:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --body:"Hiragino Sans","Yu Gothic","Noto Sans JP","Helvetica Neue",sans-serif;
  --num:ui-monospace,"SF Mono","Menlo","Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  min-height:100vh;padding-bottom:70px;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 13px env(safe-area-inset-bottom)}
.head{padding:18px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.h1{font-family:var(--disp);font-size:18px;letter-spacing:.14em;margin:0}
.save{font-size:11px;color:var(--muted);font-family:var(--num)}
.tabs{display:flex;border-bottom:1px solid var(--net);margin-bottom:14px;position:sticky;top:0;background:var(--ground);z-index:5}
.tabs button{flex:1;background:none;border:none;padding:11px 0 9px;font-family:var(--disp);
  font-size:13px;letter-spacing:.12em;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--signal)}
.card{background:var(--card);border:1px solid var(--net);border-radius:14px;padding:14px;margin-bottom:13px}
.sec{font-family:var(--disp);font-size:12px;letter-spacing:.18em;color:var(--muted);margin:0 0 9px}
.sec.mt{margin-top:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.f{margin:0}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--net);background:var(--tag);
  border-radius:9px;padding:9px 10px;font-family:var(--num);font-size:16px;color:var(--ink)}
.f textarea{font-family:var(--body);font-size:14px;min-height:52px;resize:vertical}
.f input.txt,.f select{font-family:var(--body);font-size:15px}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--leaf);outline-offset:1px}
.ro{color:var(--muted);background:rgba(0,0,0,.03)}
.scale{display:flex;gap:5px}
.scale button{flex:1;border:1px solid var(--net);background:var(--tag);border-radius:9px;
  padding:10px 2px;font-family:var(--num);font-size:14px;color:var(--muted);cursor:pointer}
.scale button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{border:1px solid var(--net);background:var(--tag);border-radius:999px;
  padding:8px 12px;font-size:13px;color:var(--muted);cursor:pointer;font-family:var(--body)}
.chips button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn{width:100%;border:none;border-radius:11px;background:var(--signal);color:#fff;padding:13px;
  font-size:15px;font-family:var(--body);font-weight:600;cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;border:1px solid var(--net);color:var(--muted);font-weight:400}
.btn.small{padding:9px;font-size:13px;margin-top:8px}
.btn:disabled{opacity:.4}
.note{font-size:11px;color:var(--muted);line-height:1.7;margin:7px 2px 0}
.row{background:var(--card);border:1px solid var(--net);border-radius:12px;padding:10px 12px;
  margin-bottom:7px;display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;
  font-family:var(--body);color:var(--ink)}
button.row{cursor:pointer}
.lead{font-family:var(--num);font-size:17px;font-weight:600;line-height:1.15;min-width:52px}
.lead small{display:block;font-size:9px;color:var(--muted);font-weight:400;margin-top:2px;font-family:var(--body)}
.bd{flex:1;font-size:13px;line-height:1.6}
.k{color:var(--muted);font-size:11px;margin-right:3px}
.v{font-family:var(--num)}
.memo{color:var(--muted);font-size:12px;margin-top:2px}
.brix{font-family:var(--num);font-weight:600;font-size:17px}
.brix.low{color:var(--signal)}
.empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:24px 16px;
  border:1px dashed var(--net);border-radius:14px;background:rgba(255,255,255,.35);margin-bottom:12px}
.del{background:none;border:none;color:var(--net);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
table.dt{width:100%;border-collapse:collapse;font-family:var(--num);font-size:12px}
table.dt th{font-family:var(--body);font-size:10px;color:var(--muted);font-weight:400;padding:0 3px 5px;text-align:left}
table.dt td{padding:2px 3px}
table.dt input{width:100%;border:1px solid var(--net);background:var(--tag);border-radius:6px;
  padding:6px 5px;font-family:var(--num);font-size:13px;color:var(--ink)}
.pill{display:inline-block;border:1px solid var(--net);border-radius:999px;padding:2px 8px;
  font-size:11px;color:var(--muted);margin-right:5px}
.pill.warn{border-color:var(--signal);color:var(--signal)}
.filter{display:flex;gap:5px;overflow-x:auto;padding-bottom:9px}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:0 0 auto;border:1px solid var(--net);background:var(--tag);border-radius:999px;
  padding:7px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--body)}
.filter button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stat{display:flex;justify-content:space-around;text-align:center;padding:2px 0 4px}
.stat div span{display:block;font-family:var(--num);font-size:22px;font-weight:600}
.stat div small{font-size:10px;color:var(--muted)}
.warnbar{background:#F7E3DA;border:1px solid var(--signal);color:var(--signal);
  border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.7;margin-bottom:13px}
.big{font-family:var(--num);font-size:24px;font-weight:600}
.tabs button{letter-spacing:.04em;font-size:13px}
/* 開花 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.tile{position:relative;min-height:50px;border:1px solid var(--net);background:var(--tag);border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:3px 1px;
  font-family:var(--num);color:var(--ink)}
.tile .n{font-size:14px;font-weight:600;line-height:1.2}
.tile .d{font-size:10px;color:var(--muted);min-height:12px}
.tile.has{background:#DCE9D9;border-color:var(--leaf)}
.tile.has .d{color:var(--leaf);font-weight:600}
.tile.same{box-shadow:inset 0 0 0 2px var(--leaf)}
.tile.out{opacity:.5;border-style:dashed;background:transparent}
.tile.out .n{text-decoration:line-through}
.tile.warn::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--signal)}
.pair{display:flex;gap:0;padding:0;overflow:hidden}
.pair .half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;align-self:stretch;padding:3px 0}
.pair .half+.half{border-left:1px solid var(--net)}
.pair .half.has{background:#DCE9D9}
.pair .half.same{box-shadow:inset 0 0 0 2px var(--leaf)}
.pair .n{font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10px;color:var(--muted);margin-top:9px}
.legend i{display:inline-block;width:12px;height:9px;border-radius:3px;border:1px solid var(--net);vertical-align:-1px;margin-right:3px}
.undo{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;background:var(--tag);
  border:1px solid var(--net);border-radius:9px;padding:7px 10px;margin-bottom:9px}
.undo button{background:none;border:none;color:var(--signal);font-weight:600;font-size:12px;cursor:pointer;padding:0}
.edit{border:2px solid var(--leaf);border-radius:12px;padding:11px;margin-bottom:10px;background:var(--tag)}
.lt{width:100%;border-collapse:collapse;font-size:12px}
.lt th{font-size:10px;color:var(--muted);font-weight:400;text-align:left;padding:4px 4px;border-bottom:1px solid var(--net)}
.lt td{padding:6px 4px;border-bottom:1px solid rgba(195,183,142,.5);font-family:var(--num);white-space:nowrap}
.lt td.t{font-family:var(--body)}
.lt tr.o td{color:#A4AA9C}
.lt .r{text-align:right}
.days{font-weight:600}
/* 推移 */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--num);font-size:10px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 74px 64px;gap:7px;align-items:end;padding:8px 0;border-bottom:1px solid rgba(195,183,142,.6)}
.brow .who{min-width:0;font-size:12px;line-height:1.4}
.brow .who b{font-family:var(--num);font-size:15px}
.brow .who span{display:block;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow input{width:100%;border:1px solid var(--net);background:var(--tag);border-radius:8px;padding:8px 6px;font-family:var(--num);font-size:16px;color:var(--ink)}
.brow label{font-size:9px;color:var(--muted);display:block;margin-bottom:2px}
.brow.out{opacity:.45}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px 1px 0;vertical-align:middle}
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff;padding:0}
  .wrap{display:none}
  #printArea{display:block;font-family:var(--body);color:#000}
  #printArea section{page-break-after:always}
  #printArea section:last-child{page-break-after:auto}
  #printArea h2{font-size:14pt;margin:0 0 3mm;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5pt solid #000;padding-bottom:1mm}
  #printArea h2 small{font-size:8.5pt;font-weight:400}
  #printArea .cols{column-count:2;column-gap:6mm}
  #printArea table{width:100%;border-collapse:collapse;font-size:8.5pt}
  #printArea th{font-weight:400;font-size:7pt;text-align:left;border-bottom:.8pt solid #000;padding:.6mm 1mm}
  #printArea td{border-bottom:.3pt solid #999;padding:0 1mm;height:6.3mm;white-space:nowrap;font-family:var(--num)}
  #printArea td.r{text-align:right;font-weight:700}
  #printArea td.s{font-size:7pt;font-family:var(--body)}
  #printArea td.c{text-align:center;font-size:11pt}
  #printArea tr{break-inside:avoid}
  #printArea tr.o td{color:#888}
  #printArea tr.o td:first-child{text-decoration:line-through}
  #printArea .foot{font-size:7pt;color:#555;margin-top:2mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 class="h1">メロン栽培記録</h1><span class="save" id="status"></span></div>
  <div class="tabs" id="tabs"></div>
  <div id="warn"></div>
  <div id="app"></div>
</div>
<div id="printArea"></div>

<script>
"use strict";

var KEY = "melon-diary-v2";
var SEED = {
  plantDate: "2026-08-10",
  blocks: [
    { id:"b1", bed:1, side:"東", variety:"ミラノ",       start:1,   count:60, per:1 },
    { id:"b2", bed:1, side:"西", variety:"セイヌ",       start:101, count:62, per:1 },
    { id:"b3", bed:2, side:"東", variety:"ミラノ",       start:201, count:62, per:1 },
    { id:"b4", bed:2, side:"西", variety:"ポルト",       start:301, count:61, per:1 },
    { id:"b5", bed:3, side:"東", variety:"ミラノ",       start:401, count:60, per:1 },
    { id:"b6", bed:3, side:"西", variety:"パールシャドウ", start:501, count:62, per:2 }
  ],
  daily: [], events: [], fruits: []
};

var db = null, tab = "daily", editing = null, dailyMode = "one", fruitFilter = "all", fruitPollenTouched = false;
var exState = { kind:"fruit", blockIds:[], dateField:"pollen", from:"", to:"",
                onlyBrix:false, onlyHarvest:false, cols:["id","date","acc","size","brix","leaf","look","etc"] };

/* ---------- storage ---------- */
function canStore(){
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return false; }
}
function loadDb(){
  try { var s = localStorage.getItem(KEY); db = s ? JSON.parse(s) : JSON.parse(JSON.stringify(SEED)); }
  catch(e){ db = JSON.parse(JSON.stringify(SEED)); }
  if(!db.blocks) db.blocks = JSON.parse(JSON.stringify(SEED.blocks));
  if(!db.daily) db.daily = [];
  if(!db.events) db.events = [];
  if(!db.fruits) db.fruits = [];
  if(!db.flowers) db.flowers = {};   // "001-1": { date, note }
  if(!db.growth) db.growth = {};     // "001-1": [ { date, dia, brix, leaves, note, guess } ]
  if(!db.tracked) db.tracked = [];   // 直径・糖度を測る果実（測定がまだ無いものも含む）
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); status("保存済み"); }
  catch(e){ status("保存できませんでした"); alert("保存できませんでした。出力タブからバックアップを取ってください。"); }
}
function status(t){
  var el = document.getElementById("status");
  el.textContent = t;
  if(t === "保存済み") setTimeout(function(){ if(el.textContent === "保存済み") el.textContent = ""; }, 1200);
}

/* ---------- helpers ---------- */
function today(){
  var d = new Date(), p = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function dd(a,b){ if(!a||!b) return null;
  return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
function md(d){ return d ? (+d.slice(5,7)) + "/" + (+d.slice(8,10)) : ""; }
function n3(n){ return String(n).padStart(3,"0"); }
function num(v){ if(v===""||v==null) return null; var f = parseFloat(v); return isNaN(f)?null:f; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function blockName(b){ return b.bed + "列" + b.side + " " + b.variety; }
function findBlock(no){ if(!no) return null;
  for(var i=0;i<db.blocks.length;i++){ var b = db.blocks[i];
    if(no >= b.start && no < b.start + b.count) return b; }
  return null; }
function normDate(s){
  if(!s) return null;
  var t = String(s).trim().replace(/["']/g,"");
  var m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return m[1] + "-" + String(+m[2]).padStart(2,"0") + "-" + String(+m[3]).padStart(2,"0");
  m = t.match(/^(\d{1,2})[-\/.](\d{1,2})$/);
  if(m) return new Date().getFullYear() + "-" + String(+m[1]).padStart(2,"0") + "-" + String(+m[2]).padStart(2,"0");
  return null;
}
function accum(pollen,end){
  var g = 0, s = 0, n = 0;
  db.daily.forEach(function(r){
    if(!pollen || r.date < pollen || r.date > end) return;
    var t = r.tAvg != null ? r.tAvg : (r.tMax != null && r.tMin != null ? (r.tMax + r.tMin)/2 : null);
    if(t != null){ g += Math.max(t-10,0); n++; }
    if(r.solar != null) s += r.solar;
  });
  return { gdd:g, sol:s, n:n };
}
function val(id){ var e = document.getElementById(id); return e ? e.value : ""; }
function pick(k){ var e = document.querySelector('[data-grp="'+k+'"] button.on'); return e ? e.dataset.v : null; }
function scaleHtml(k,v){
  var h = '<div class="scale" data-grp="'+k+'">';
  for(var i=1;i<=5;i++) h += '<button type="button" data-v="'+i+'"'+(String(v)===String(i)?' class="on"':'')+'>'+i+'</button>';
  return h + '</div>';
}
function chipHtml(k,opts,v){
  var h = '<div class="chips" data-grp="'+k+'">';
  opts.forEach(function(o){ h += '<button type="button" data-v="'+esc(o)+'"'+(v===o?' class="on"':'')+'>'+esc(o)+'</button>'; });
  return h + '</div>';
}
document.addEventListener("click", function(e){
  var b = e.target.closest('[data-grp] button');
  if(!b) return;
  var on = b.classList.contains("on");
  b.parentNode.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
  if(!on) b.classList.add("on");
  if(b.parentNode.dataset.grp === "exkind" || b.parentNode.dataset.grp === "exdate"){ /* handled elsewhere */ }
});

/* ---------- shell ---------- */
var TABS = [["daily","日誌"],["bloom","開花"],["grow","推移"],["fruit","果実"],["plant","株"],["out","出力"],["conf","設定"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    return '<button data-tab="'+t[0]+'"'+(tab===t[0]?' class="on"':'')+'>'+t[1]+'</button>';
  }).join("");
  document.querySelectorAll("#tabs button").forEach(function(b){
    b.onclick = function(){ tab = b.dataset.tab; editing = null; render(); };
  });
}
function render(keepScroll){
  renderTabs();
  var el = document.getElementById("app");
  var y = window.scrollY;
  if(tab === "bloom" || tab === "grow"){
    el.innerHTML = tab === "bloom" ? bloomTab() : growTab();
    if(tab === "bloom") bindBloom(); else bindGrow();
    window.scrollTo(0, keepScroll ? y : 0);
    return;
  }
  if(tab === "daily") el.innerHTML = dailyTab();
  else if(tab === "fruit") el.innerHTML = editing ? fruitForm() : fruitTab();
  else if(tab === "plant") el.innerHTML = plantTab();
  else if(tab === "out") el.innerHTML = exportTab();
  else el.innerHTML = confTab();
  bind();
  window.scrollTo(0,0);
}

/* ---------- 日誌 ---------- */
function dailyTab(){
  var h = '<div class="filter">'
    + '<button id="m1" class="'+(dailyMode==="one"?"on":"")+'">1日ずつ</button>'
    + '<button id="m2" class="'+(dailyMode==="bulk"?"on":"")+'">まとめて取り込む</button></div>';

  if(dailyMode === "one"){
    h += '<div class="card"><div class="sec">そ の 日 の 記 録</div><div class="g2">'
      + fld("d_date","日付",'<input type="date" id="d_date" value="'+today()+'">')
      + fld("d_solar","日射",'<input id="d_solar" inputmode="decimal">')
      + fld("d_tavg","平均気温 ℃",'<input id="d_tavg" inputmode="decimal">')
      + fld("d_tmax","最高気温 ℃",'<input id="d_tmax" inputmode="decimal">')
      + fld("d_tmin","最低気温 ℃",'<input id="d_tmin" inputmode="decimal">')
      + fld("d_ecin","給液EC",'<input id="d_ecin" inputmode="decimal">')
      + fld("d_ecout","排液EC",'<input id="d_ecout" inputmode="decimal">')
      + '</div>'
      + '<div class="f" style="margin-top:10px"><label>作業内容</label>'
      + '<textarea id="d_work" placeholder="整枝、交配、摘果、防除など"></textarea></div>'
      + '<div class="f" style="margin-top:10px"><label>設定変更（変えた日だけ）</label>'
      + '<textarea id="d_change" placeholder="給液EC 1.8→1.5、灌水回数 4→3 など"></textarea></div>'
      + '<button class="btn" id="d_save">この日を記録する</button></div>';
  } else {
    h += '<div class="card"><div class="sec">気 温 ・ 日 射 の 取 り 込 み</div>'
      + '<p class="note" style="margin-top:0">1行1日、左から 日付, 平均気温, 最高気温, 最低気温, 日射 の順'
      + '（カンマでもタブでも可）。見出し行は無視されます。</p>'
      + '<div class="f"><textarea id="d_paste" style="min-height:130px;font-family:var(--num);font-size:12px"></textarea></div>'
      + '<p class="note" id="d_prev"></p>'
      + '<button class="btn" id="d_imp">取り込む</button></div>';
  }

  if(db.daily.length === 0){
    h += '<div class="empty">まだ日誌がありません。<br>交配が始まったら、気温と日射をためていきます。</div>';
  } else {
    db.daily.slice(0,60).forEach(function(r){
      var w = ["日","月","火","水","木","金","土"][new Date(r.date+"T00:00:00").getDay()];
      h += '<div class="row"><div class="lead">'+md(r.date)+'<small>'+w+'</small></div><div class="bd">';
      if(r.tAvg != null || r.tMax != null)
        h += '<span class="k">気温</span><span class="v">'+(r.tAvg==null?"–":r.tAvg)+'（'+(r.tMax==null?"–":r.tMax)+'/'+(r.tMin==null?"–":r.tMin)+'）</span>　';
      if(r.solar != null) h += '<span class="k">日射</span><span class="v">'+r.solar+'</span>　';
      if(r.ecIn != null || r.ecOut != null)
        h += '<span class="k">EC</span><span class="v">'+(r.ecIn==null?"–":r.ecIn)+'→'+(r.ecOut==null?"–":r.ecOut)+'</span>';

function fld(id,label,input){ return '<div class="f"><label for="'+id+'">'+label+'</label>'+input+'</div>'; }

function mergeDaily(rows){
  var map = {};
  db.daily.forEach(function(r){ map[r.date] = r; });
  rows.forEach(function(r){
    var cur = map[r.date] || { date:r.date };
    Object.keys(r).forEach(function(k){
      if(r[k] !== null && r[k] !== "" && r[k] !== undefined) cur[k] = r[k];
    });
    map[r.date] = cur;
  });
  db.daily = Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  save(); render();
}
function parsePaste(txt){
  if(!txt.trim()) return [];
  return txt.trim().split(/\r?\n/).map(function(line){
    var c = line.split(/[\t,]/).map(function(s){ return s.trim(); });
    var d = normDate(c[0]);
    if(!d) return null;
    return { date:d, tAvg:num(c[1]), tMax:num(c[2]), tMin:num(c[3]), solar:num(c[4]) };
  }).filter(Boolean);
}

  { key:"id",   label:"株番号・区画・品種",   head:["株番号","果実番号","ベッド","東西","品種","定植日"] },

  { key:"etc",  label:"トラブル・メモ",       head:["株のトラブル","メモ"] }
];
function clean(v){ return v == null ? "" : String(v).replace(/[\r\n\t,]/g," "); }

function buildRows(){
  var o = exState;
  if(o.kind === "daily"){
    var rows = [["日付","平均気温","最高気温","最低気温","日射","給液EC","排液EC","作業内容","設定変更"]];
    db.daily.slice().filter(function(r){
      return (!o.from || r.date >= o.from) && (!o.to || r.date <= o.to);
    }).sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(r){
      rows.push([r.date,r.tAvg,r.tMax,r.tMin,r.solar,r.ecIn,r.ecOut,clean(r.work),clean(r.change)]);
    });
    return rows;
  }
  if(o.kind === "event"){
    var rows2 = [["日付","株番号from","株番号to","区画","内容","詳細"]];
    db.events.filter(function(e){
      if(o.from && e.date < o.from) return false;
      if(o.to && e.date > o.to) return false;
      if(o.blockIds.length){ var b = findBlock(e.from); if(!b || o.blockIds.indexOf(b.id) < 0) return false; }
      return true;
    }).sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(e){
      var b = findBlock(e.from);
      rows2.push([e.date,n3(e.from),n3(e.to),b?blockName(b):"",e.kind,clean(e.memo)]);
    });
    return rows2;
  }
  if(o.kind === "flower"){
    var rf = [["株番号","果実番号","区画","品種","開花日","開花後日数(" + today() + ")","収穫日","株の状態","メモ"]];
    allSlots().forEach(function(s){
      if(o.blockIds.length && o.blockIds.indexOf(s.b.id) < 0) return;
      var fl = db.flowers[s.k] || {};
      if(o.from && (!fl.date || fl.date < o.from)) return;
      if(o.to && (!fl.date || fl.date > o.to)) return;
      var st = plantStatus(s.no), hv = harvestOf(s.k);
      rf.push([n3(s.no), s.f, s.b.bed + "列" + s.b.side, s.b.variety, fl.date || "",
        fl.date ? dd(fl.date, today()) : "", hv || "", st ? clean(st.label) : "", clean(fl.note)]);
    });
    return rf;
  }
  if(o.kind === "growth"){
    var rg = [["株番号","果実番号","品種","開花日","測定日","開花後日数","直径mm","糖度","健全葉数","メモ"]];
    trackedKeys().forEach(function(k){
      var p = splitKey(k), b = findBlock(p.no);
      if(o.blockIds.length && (!b || o.blockIds.indexOf(b.id) < 0)) return;
      var fl = (db.flowers[k] || {}).date || "";
      (db.growth[k] || []).forEach(function(m){
        if(o.from && m.date < o.from) return;
        if(o.to && m.date > o.to) return;
        rg.push([n3(p.no), p.f, b ? b.variety : "", fl, m.date + (m.guess ? "(仮)" : ""),
          fl ? dd(fl, m.date) : "", m.dia, m.brix, m.leaves, clean(m.note)]);
      });
    });
    return rg;
  }
  var cols = FRUIT_COLS.filter(function(c){ return o.cols.indexOf(c.key) >= 0; });
  var head = [];
  cols.forEach(function(c){ head = head.concat(c.head); });
  var rows3 = [head];
  db.fruits.filter(function(x){
    if(o.blockIds.length && o.blockIds.indexOf(x.blockId) < 0) return false;
    if(o.onlyBrix && x.brix == null) return false;
    if(o.onlyHarvest && !x.harvest) return false;
    var d = o.dateField === "harvest" ? x.harvest : x.pollen;
    if(o.from && (!d || d < o.from)) return false;
    if(o.to && (!d || d > o.to)) return false;
    return true;
  }).sort(function(a,b){ return a.no === b.no ? (a.fno||1)-(b.fno||1) : a.no-b.no; })
    .forEach(function(x){
      var b = db.blocks.filter(function(z){ return z.id === x.blockId; })[0];
      var end = x.harvest || today();
      var a = accum(x.pollen,end);
      var parts = {
        id:[n3(x.no), x.fno||1, b?b.bed:"", b?b.side:"", b?b.variety:"", db.plantDate],
        date:[x.pollen, x.harvest||"", dd(x.pollen,end)],
        acc:[a.gdd.toFixed(0), a.sol.toFixed(1)],
        size:[x.dia, x.weight],
        brix:[x.b1,x.b2,x.b3,x.brix, (x.b1!=null&&x.b3!=null)?(x.b1-x.b3).toFixed(1):""],
        leaf:[x.droop,x.color,x.leaves],
        look:[x.dens,x.relief,x.shoulder,x.ridge],
        etc:[x.trouble, clean(x.memo)]
      };
      var r = [];
      cols.forEach(function(c){ r = r.concat(parts[c.key]); });
      rows3.push(r);
    });
  return rows3;
}

var VCOL = { "ミラノ":"#1F5E44", "セイヌ":"#B07A12", "ポルト":"#2C64A8", "パールシャドウ":"#8A4FA6" };
function vcol(v){ return VCOL[v] || "#6E7A6A"; }
function fkey(no,f){ return n3(no) + "-" + (f || 1); }
function splitKey(k){ var a = k.split("-"); return { no: parseInt(a[0],10), f: parseInt(a[1],10) || 1 }; }
function keyLabel(k){ var p = splitKey(k), b = findBlock(p.no); return n3(p.no) + (b && b.per > 1 ? "-" + p.f : ""); }
function allSlots(blockId){
  var out = [];
  db.blocks.forEach(function(b){
    if(blockId && blockId !== "all" && b.id !== blockId) return;
    for(var i = 0; i < b.count; i++) for(var f = 1; f <= (b.per || 1); f++)
      out.push({ no: b.start + i, f: f, b: b, k: fkey(b.start + i, f) });
  });
  return out;
}
var OUT_RE = /撤去|落下/;
function plantStatus(no){
  var best = null;
  db.events.forEach(function(e){
    if(no < e.from || no > e.to) return;
    var out = e.kind === "枯死" || OUT_RE.test(e.memo || "");
    var cur = { out: out, label: e.kind + (e.memo ? "（" + e.memo + "）" : ""), date: e.date };
    if(!best || (out && !best.out) || (out === best.out && e.date >= best.date)) best = cur;
  });
  return best;
}
function harvestOf(k){
  var p = splitKey(k), h = null;
  db.fruits.forEach(function(x){ if(x.no === p.no && (x.fno || 1) === p.f && x.harvest) h = x.harvest; });
  return h;
}
function trackedKeys(){
  var set = {};
  db.tracked.forEach(function(k){ set[k] = 1; });
  Object.keys(db.growth).forEach(function(k){ if(db.growth[k].length) set[k] = 1; });
  return Object.keys(set).sort();
}

function setTracked(k,on){
  var i = db.tracked.indexOf(k);
  db.hiddenGrowth = db.hiddenGrowth || {};
  if(on){
    if(i < 0) db.tracked.push(k);
    if(db.hiddenGrowth[k]){ db.growth[k] = db.hiddenGrowth[k]; delete db.hiddenGrowth[k]; }
  } else {
    if(i >= 0) db.tracked.splice(i,1);
    if(db.growth[k] && db.growth[k].length){ db.hiddenGrowth[k] = db.growth[k]; delete db.growth[k]; }
  }
}

function bloomTab(){
  var slots = allSlots(), done = 0, aliveLeft = 0;
  slots.forEach(function(s){
    var has = db.flowers[s.k] && db.flowers[s.k].date;
    if(has) done++;
    var st = plantStatus(s.no);
    if(!has && !(st && st.out)) aliveLeft++;
  });
  var h = '';
  if(!db.migrated){
    var junk = db.fruits.filter(function(x){ return !x.harvest; }).length;
    h += '<div class="card" style="border-color:var(--leaf)"><div class="sec">今 ま で の 記 録 を 取 り 込 む</div>'

      + '途中の直径・糖度（' + Object.keys(MIGRATE.growth).length + '果）を、開花・推移タブに移します。1回だけ行います。</p>'
      + (junk ? '<label class="note" style="display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink)">'
        + '<input type="checkbox" id="mg_clean" checked style="margin-top:3px">果実タブにある、収穫日の無い途中測定の行（' + junk + '行）を削除する。'
        + '収穫済みの果実の記録は残します。</label>' : '')
      + '<button class="btn" id="mg_go">取り込む</button>'
      + '<button class="btn ghost small" id="mg_skip">取り込まない</button></div>';
  }
  h += '<div class="card"><div class="stat">'
    + '<div><span>' + done + '</span><small>開花日あり / ' + slots.length + '果</small></div>'
    + '<div><span>' + aliveLeft + '</span><small>生きている株で未入力</small></div></div></div>';
  h += '<div class="filter"><button id="bm_tap" class="' + (bl.mode === "tap" ? "on" : "") + '">タップで入力</button>'
    + '<button id="bm_list" class="' + (bl.mode === "list" ? "on" : "") + '">一覧・印刷</button></div>';
  return h + (bl.mode === "tap" ? bloomTap() : bloomList());

function tileClass(k){

function bindBloom(){
  var g = function(id){ return document.getElementById(id); };
  if(g("mg_go")) g("mg_go").onclick = function(){
    var clean = g("mg_clean") && g("mg_clean").checked;
    Object.keys(MIGRATE.flowers).forEach(function(k){
      if(!db.flowers[k] || !db.flowers[k].date) db.flowers[k] = { date: MIGRATE.flowers[k], note: "" };
    });
    Object.keys(MIGRATE.growth).forEach(function(k){
      if(db.growth[k] && db.growth[k].length) return;
      db.growth[k] = MIGRATE.growth[k].map(function(a){
        var m = { date:a[0] };
        if(a[1] != null) m.dia = a[1]; if(a[2] != null) m.brix = a[2]; if(a[3] != null) m.leaves = a[3];
        if(a[4]) m.note = a[4]; if(a[5]) m.guess = true;
        return m;
      });
    });
    if(clean) db.fruits = db.fruits.filter(function(x){ return !!x.harvest; });
    db.migrated = today(); save(); render();
  };
  if(g("mg_skip")) g("mg_skip").onclick = function(){ db.migrated = "skip"; save(); render(); };
  g("bm_tap").onclick = function(){ bl.mode = "tap"; render(); };
  g("bm_list").onclick = function(){ bl.mode = "list"; render(); };

  if(bl.mode === "tap"){
    g("bl_date").onchange = function(){ bl.date = this.value; render(true); };
    document.querySelectorAll("#bl_blocks button").forEach(function(b){
      b.onclick = function(){ bl.block = b.dataset.blk; bl.edit = null; render(true); };
    });
    document.querySelectorAll("#bl_card [data-k]").forEach(function(el){
      el.onclick = function(){
        var k = el.dataset.k, fl = db.flowers[k];
        if(fl && fl.date){ bl.edit = k; render(true);
          var e = g("bl_edit"); if(e) e.scrollIntoView({ block:"center" }); return; }
        if(!bl.date){ alert("先に記録する開花日を選んでください。"); return; }
        var prev = fl ? JSON.parse(JSON.stringify(fl)) : null;
        db.flowers[k] = { date: bl.date, note: fl && fl.note ? fl.note : "" };
        bl.undo = { k:k, prev:prev, text: keyLabel(k) + " を " + md(bl.date) + " 開花で記録しました" };
        bl.edit = null; save(); render(true);
      };
    });
    if(g("bl_undo")) g("bl_undo").onclick = function(){
      var u = bl.undo; if(!u) return;
      if(u.prev) db.flowers[u.k] = u.prev; else delete db.flowers[u.k];
      bl.undo = null; save(); render(true);
    };
    if(g("be_save")) g("be_save").onclick = function(){
      var k = bl.edit, d = val("be_date");
      if(d) db.flowers[k] = { date:d, note: val("be_note").trim() };
      else delete db.flowers[k];
      var was = trackedKeys().indexOf(k) >= 0;
      if(g("be_track").checked !== was) setTracked(k, g("be_track").checked);
      bl.edit = null; bl.undo = null; save(); render(true);
    };
    if(g("be_clear")) g("be_clear").onclick = function(){
      var k = bl.edit, prev = db.flowers[k];
      delete db.flowers[k];
      bl.undo = { k:k, prev:prev, text: keyLabel(k) + " の開花日を消しました" };
      bl.edit = null; save(); render(true);
    };
    if(g("be_close")) g("be_close").onclick = function(){ bl.edit = null; render(true); };
  } else {
    g("ls_blk").onchange = function(){ bl.lsBlock = this.value; render(true); };
    g("ls_sort").onchange = function(){ bl.lsSort = this.value; render(true); };
    g("ls_base").onchange = function(){ bl.lsBase = this.value || today(); render(true); };
    g("ls_hide").onchange = function(){ bl.lsHide = this.checked; render(true); };
    g("ls_print").onclick = function(){ buildPrint(); window.print(); };
    document.querySelectorAll(".lt [data-k]").forEach(function(tr){
      tr.onclick = function(){
        var p = splitKey(tr.dataset.k), b = findBlock(p.no);
        bl.mode = "tap"; bl.block = b ? b.id : bl.block; bl.edit = tr.dataset.k; render();
        var e = g("bl_edit"); if(e) e.scrollIntoView({ block:"center" });
      };
    });
  }
}

function chartSvg(keys){
  var isDia = gr.metric === "dia", series = [], noFl = 0, guess = false;
  keys.forEach(function(k){
    var p = splitKey(k), b = findBlock(p.no), v = b ? b.variety : "";
    if(gr.off[v]) return;
    var fl = db.flowers[k] && db.flowers[k].date;
    var pts = (db.growth[k] || []).filter(function(m){ return m[gr.metric] != null; }).map(function(m){
      if(m.guess) guess = true;
      return { x: gr.x === "days" ? (fl ? dd(fl, m.date) : null) : Date.parse(m.date + "T00:00:00Z")/864e5, y: m[gr.metric], g: m.guess };
    });
    if(gr.x === "days" && !fl){ if(pts.length) noFl++; return; }
    if(pts.length) series.push({ k:k, v:v, pts: pts.sort(function(a,b){ return a.x - b.x; }) });
  });
  if(!series.length) return '<p class="note">表示できる測定がありません。</p>';
  var W = 560, H = 290, L = 36, R = 10, T = 14, B = 30;
  var xs = [], ys = [];
  series.forEach(function(s){ s.pts.forEach(function(p){ xs.push(p.x); ys.push(p.y); }); });
  var x0, x1, xt = [], step = isDia ? 20 : 2;
  if(gr.x === "days"){ x0 = 0; x1 = Math.max(50, Math.ceil(Math.max.apply(null,xs)/10)*10); for(var v=0; v<=x1; v+=10) xt.push(v); }
  else { x0 = Math.min.apply(null,xs) - 1; x1 = Math.max.apply(null,xs) + 1;
    var st = Math.max(7, Math.ceil((x1-x0)/6)); for(var v2=Math.ceil(x0); v2<=x1; v2+=st) xt.push(v2); }
  var y0 = Math.floor(Math.min.apply(null,ys)/step)*step, y1 = Math.ceil(Math.max.apply(null,ys)/step)*step;
  if(y1 === y0) y1 += step;
  var sx = function(v){ return L + (v-x0)/(x1-x0)*(W-L-R); }, sy = function(v){ return T + (1-(v-y0)/(y1-y0))*(H-T-B); };
  var dl = function(v){ var d = new Date(v*864e5); return (d.getUTCMonth()+1) + "/" + d.getUTCDate(); };
  var s = '';
  for(var yv = y0; yv <= y1 + 1e-9; yv += step)
    s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+sy(yv)+'" y2="'+sy(yv)+'" stroke="#D6D3BE"/><text x="'+(L-5)+'" y="'+(sy(yv)+3)+'" text-anchor="end">'+yv+'</text>';
  xt.forEach(function(v){ s += '<text x="'+sx(v)+'" y="'+(H-14)+'" text-anchor="middle">'+(gr.x === "days" ? v : dl(v))+'</text>'; });
  s += '<text x="'+(W-R)+'" y="'+(H-2)+'" text-anchor="end">'+(gr.x === "days" ? "開花後日数" : "測定日")+'</text>'
    + '<text x="'+L+'" y="'+(T-4)+'">'+(isDia ? "mm" : "Brix")+'</text>';
  series.forEach(function(se){
    var c = vcol(se.v), on = gr.sel === se.k, dim = gr.sel && !on;
    var pts = se.pts.map(function(p){ return sx(p.x).toFixed(1)+","+sy(p.y).toFixed(1); }).join(" ");
    s += '<polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="'+(on?3:1.5)+'" opacity="'+(dim?.15:.85)+'"/>';
    se.pts.forEach(function(p){ s += '<circle cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="'+(on?3.5:2.2)+'" fill="'+(p.g?"#F4F2E8":c)+'" stroke="'+c+'" opacity="'+(dim?.2:1)+'"/>'; });
    if(on){ var e = se.pts[se.pts.length-1];
      s += '<text x="'+Math.min(sx(e.x)+5, W-R-26)+'" y="'+(sy(e.y)-6)+'" style="fill:#17251D;font-weight:600">'+keyLabel(se.k)+'</text>'; }
    s += '<polyline points="'+pts+'" fill="none" stroke="transparent" stroke-width="14" data-sk="'+se.k+'" style="cursor:pointer"/>';
  });
  var notes = [];
  if(noFl) notes.push("開花日が未入力の" + noFl + "果は表示されません（「日付」なら表示）。");
  if(guess) notes.push("白抜きの点は日付不明の初回測定（9/16に仮置き）。");
  notes.push("線をタップすると1果を強調。");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="推移グラフ">' + s + '</svg><p class="note">' + notes.join(" ") + '</p>';
}

function bindGrow(){
  var g = function(id){ return document.getElementById(id); };
  document.querySelectorAll("#gr_m button").forEach(function(b){ b.onclick = function(){ gr.metric = b.dataset.v; render(true); }; });
  document.querySelectorAll("#gr_x button").forEach(function(b){ b.onclick = function(){ gr.x = b.dataset.v; render(true); }; });
  document.querySelectorAll("#gr_v button").forEach(function(b){ b.onclick = function(){ gr.off[b.dataset.v] = !gr.off[b.dataset.v]; render(true); }; });
  document.querySelectorAll("[data-sk]").forEach(function(el){
    el.onclick = function(){ gr.sel = gr.sel === el.dataset.sk ? "" : el.dataset.sk; render(true); };
  });
  g("gr_date").onchange = function(){ gr.date = this.value || today(); gr.msg = ""; render(true); };
  g("gr_save").onclick = function(){
    var n = 0, dt = gr.date;
    document.querySelectorAll("[data-gd]").forEach(function(inp){
      var k = inp.dataset.gd, bi = document.querySelector('[data-gb="' + k + '"]');
      var dia = num(inp.value), brix = num(bi.value);
      var ms = db.growth[k] || [], old = ms.filter(function(m){ return m.date === dt; })[0];
      if(dia == null && brix == null && !old) return;
      if(old && old.dia === (dia == null ? undefined : dia) && old.brix === (brix == null ? undefined : brix)) return;
      ms = ms.filter(function(m){ return m.date !== dt; });
      if(dia != null || brix != null){
        var m = { date:dt };
        if(dia != null) m.dia = dia; if(brix != null) m.brix = brix;
        if(old && old.leaves != null) m.leaves = old.leaves; if(old && old.note) m.note = old.note;
        ms.push(m); ms.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
      }
      db.growth[k] = ms; n++;
    });
    gr.msg = n ? md(dt) + " の測定を" + n + "果保存しました" : "変更はありません";
    if(n) save(); render(true);
  };
  g("ga_go").onclick = function(){
    var no = parseInt(val("ga_no"),10), f = parseInt(val("ga_f"),10) || 1, b = findBlock(no);
    if(!b){ g("ga_msg").textContent = "株番号が区画の範囲外です"; return; }
    if(f > (b.per || 1)){ g("ga_msg").textContent = b.variety + "は1株1果です"; return; }
    var k = fkey(no,f);
    if(trackedKeys().indexOf(k) >= 0){ g("ga_msg").textContent = "登録済みです"; return; }
    setTracked(k, true); save(); render(true);
  };
  g("gr_pick").onchange = function(){ gr.sel = this.value; render(true); };
  document.querySelectorAll("[data-gx]").forEach(function(b){
    b.onclick = function(){
      if(!confirm("この測定を消します。")) return;
      db.growth[gr.sel].splice(+b.dataset.gx, 1); save(); render(true);
    };
  });
  if(g("gr_untrack")) g("gr_untrack").onclick = function(){
    if(!confirm("測定対象から外します（測った記録は残ります。もう一度追加すれば戻ります）。")) return;
    setTracked(gr.sel, false);
    gr.sel = ""; save(); render(true);
  };
}

/* ---------- clipboard / download ---------- */
function copyText(t,cb){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ cb(true); }, function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta); cb(ok);
  }
}
function downloadText(name,text,type){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{ type: type || "text/plain" }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 500);
}

    });
  }

  if(tab === "fruit" && editing){
    fruitPollenTouched = false;
    ["f_no","f_pollen","f_harvest","f_b1","f_b2","f_b3"].forEach(function(id){
      var e = document.getElementById(id);
      if(e) e.oninput = function(){ if(id === "f_pollen") fruitPollenTouched = true; fruitLive(); };
    });
    document.getElementById("f_fno").onchange = fruitLive;
    if(editing.id) document.getElementById("f_fno").value = String(editing.fno || 1);
    fruitLive();
    document.getElementById("f_save").onclick = function(){
      var no = parseInt(val("f_no"),10), pollen = val("f_pollen");
      if(!no || !pollen){ alert("株番号と交配日を入れてください。"); return; }
      var b = findBlock(no);
      var bx = [val("f_b1"),val("f_b2"),val("f_b3")].map(num).filter(function(v){ return v != null; });
      var avg = bx.length ? bx.reduce(function(a,b){ return a+b; },0)/bx.length : null;
      var tr = db.events.filter(function(e){ return no >= e.from && no <= e.to; });
      var rec = {
        id: editing.id || uid(), no:no, fno: parseInt(val("f_fno"),10) || 1,
        blockId: b ? b.id : null, pollen:pollen, harvest: val("f_harvest") || null,
        dia:num(val("f_dia")), weight:num(val("f_weight")),
        b1:num(val("f_b1")), b2:num(val("f_b2")), b3:num(val("f_b3")),
        brix: avg == null ? null : Math.round(avg*10)/10,
        droop: pick("droop"), color: pick("color"), leaves:num(val("f_leaves")),
        dens: pick("dens"), relief: pick("relief"), shoulder: pick("shoulder"), ridge: pick("ridge"),
        trouble: tr.length ? tr.map(function(t){ return t.kind; }).join("・") : null,
        memo: val("f_memo").trim()
      };
      if(editing.id) db.fruits = db.fruits.map(function(x){ return x.id === rec.id ? rec : x; });
      else db.fruits.push(rec);
      save(); editing = null; render();
    };
    document.getElementById("f_cancel").onclick = function(){ editing = null; render(); };
    var fd = document.getElementById("f_del");
    if(fd) fd.onclick = function(){
      if(!confirm("この果実の記録を消します。")) return;
      db.fruits = db.fruits.filter(function(x){ return x.id !== editing.id; });
      save(); editing = null; render();
    };
  }

  if(tab === "plant"){
    document.getElementById("p_save").onclick = function(){
      var from = parseInt(val("p_from"),10), kind = pick("kind");
      if(!from || !kind){ alert("株番号と内容を入れてください。"); return; }
      db.events.push({ id:uid(), date:val("p_date"), from:from,
        to: parseInt(val("p_to"),10) || from, kind:kind, memo:val("p_memo").trim() });
      db.events.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
      save(); render();
    };
  }

  if(tab === "out"){
    document.querySelectorAll("#ex_kind button").forEach(function(b){
      b.onclick = function(){ exState.kind = b.dataset.k; render(); };
    });
    document.querySelectorAll("#ex_blk button").forEach(function(b){
      b.onclick = function(){
        var i = exState.blockIds.indexOf(b.dataset.b);
        if(i >= 0) exState.blockIds.splice(i,1); else exState.blockIds.push(b.dataset.b);
        render();
      };
    });
    document.querySelectorAll("#ex_df button").forEach(function(b){
      b.onclick = function(){ exState.dateField = b.dataset.d; render(); };
    });
    document.querySelectorAll("#ex_cond button").forEach(function(b){
      b.onclick = function(){ exState[b.dataset.c] = !exState[b.dataset.c]; render(); };
    });
    document.querySelectorAll("#ex_cols button").forEach(function(b){
      b.onclick = function(){
        var i = exState.cols.indexOf(b.dataset.c);
        if(i >= 0) exState.cols.splice(i,1); else exState.cols.push(b.dataset.c);
        render();
      };
    });
    document.getElementById("ex_from").onchange = function(){ exState.from = this.value; render(); };
    document.getElementById("ex_to").onchange = function(){ exState.to = this.value; render(); };

    document.getElementById("ex_copy").onclick = function(){
      var tsv = buildRows().map(function(r){
        return r.map(function(c){ return c == null ? "" : String(c); }).join("\t"); }).join("\n");
      copyText(tsv, function(ok){
        document.getElementById("ex_msg").textContent = ok
          ? "コピーしました。スプレッドシートのA1に貼り付けてください。"
          : "コピーできませんでした。CSVで保存してください。";
      });
    };
    document.getElementById("ex_dl").onclick = function(){
      var csv = "\ufeff" + buildRows().map(function(r){
        return r.map(function(c){ return c == null ? "" : String(c); }).join(","); }).join("\n");
      downloadText("melon-" + exState.kind + "-" + today() + ".csv", csv, "text/csv");
    };
    document.getElementById("bk_copy").onclick = function(){
      copyText(JSON.stringify(db), function(ok){
        document.getElementById("bk_msg").textContent = ok
          ? "コピーしました。メモアプリなどに貼って保存してください。" : "コピーできませんでした。";
      });
    };
    document.getElementById("bk_dl").onclick = function(){
      downloadText("melon-backup-" + today() + ".txt", JSON.stringify(db));
    };
    document.getElementById("bk_imp").onclick = function(){
      var t = val("bk_in").trim();
      if(!t){ alert("バックアップを貼り付けてください。"); return; }
      var d;
      try { d = JSON.parse(t); } catch(e){ alert("読み取れませんでした。"); return; }
      if(!d.blocks || !d.fruits){ alert("バックアップの形式が違います。"); return; }
      if(!confirm("いまの記録を、貼り付けた内容で置き換えます。")) return;
      db = d;
      if(!db.daily) db.daily = []; if(!db.events) db.events = [];
      if(!db.flowers) db.flowers = {}; if(!db.growth) db.growth = {}; if(!db.tracked) db.tracked = [];
      save(); render();
    };
  }

  if(tab === "conf"){
    document.getElementById("c_save").onclick = function(){
      db.plantDate = val("c_plant");
      document.querySelectorAll("[data-c][data-i]").forEach(function(inp){
        var b = db.blocks[+inp.dataset.i], k = inp.dataset.c;
        b[k] = (k === "side" || k === "variety") ? inp.value : (parseInt(inp.value,10) || 0);
      });
      db.fruits = db.fruits.map(function(x){
        var b = findBlock(x.no);
        x.blockId = b ? b.id : null;
        return x;
      });
      save(); render();
    };
  }
}

/* ---------- start ---------- */
loadDb();
if(!canStore()){
  document.getElementById("warn").innerHTML =
    '<div class="warnbar">この環境では記録を保存できません。ファイルを端末に保存して、'
    + 'ホーム画面から開き直してください。それでも出る場合は、プライベートブラウズを解除してください。</div>';
}
render();
</script>
</body>
